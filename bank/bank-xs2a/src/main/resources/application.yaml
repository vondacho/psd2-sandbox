spring:
  application:
    name: bank-xs2a

server:
  port: 8443
  # TLS is configured in TlsConfiguration: a custom trust manager is needed and
  # cannot be expressed declaratively.

sandbox:
  pki:
    # Shared with the other processes: they read ca.pem from here.
    directory: /tmp/psd2-pki
  bank:
    # A plain-HTTP connector for the §7.7 internal API. The XS2A port demands a client
    # certificate on every connection, which the CIAM has none of and never should.
    internal-port: 8081
  oidc:
    issuer: https://oidc-provider.sandbox
    audience: https://api.bank.sandbox/psd2
    jwks-url: https://localhost:7443/jwks
    metadata-url: https://oidc-provider.sandbox/.well-known/oauth-authorization-server
  ledger:
    # Microcks serving contracts/bank-core-ledger.openapi.yaml.
    base-url: http://localhost:8585/rest/Bank+core+ledger/1.0.0
    service-token: ledger-service-token

logging:
  level:
    ch.obya.psd2: INFO
