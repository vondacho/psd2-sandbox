spring:
  application:
    name: bank-xs2a

server:
  port: 8443
  # TLS is configured in TlsConfiguration: a custom trust manager is needed and
  # cannot be expressed declaratively.

sandbox:
  ledger:
    # Microcks serving contracts/bank-core-ledger.openapi.yaml.
    base-url: http://localhost:8585/rest/Bank+core+ledger/1.0.0
  oidc:
    metadata-url: https://oidc-provider.sandbox/.well-known/oauth-authorization-server

logging:
  level:
    ch.obya.psd2: INFO
