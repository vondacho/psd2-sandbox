spring:
  application:
    name: bank-ciam

server:
  port: 9443

sandbox:
  bank:
    # The XS2A process, for the §7.7 internal API.
    # The Bank's internal connector, not its XS2A port: that one demands a client
    # certificate on every connection and the CIAM has none.
    internal-base-url: http://localhost:8081
  ledger:
    # The same Microcks mock account information reads — but as a conformist, so the
    # ledger's own words reach the consent screen unchanged.
    base-url: http://localhost:8585/rest/Bank+core+ledger/1.0.0
    service-token: ledger-service-token

logging:
  level:
    ch.obya.psd2: INFO
