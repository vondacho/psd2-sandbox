openapi: 3.1.0
info:
  title: Bank XS2A interface — MVP profile (proposal)
  version: 0.1.0-proposal
  summary: The subset of the Berlin Group NextGenPSD2 XS2A interface v1.3.16 proposed for WS-01 and MVP-01.
  description: |
    PROPOSAL generated by AI (interface id `API-XS2A-PROFILE`).

    * Written from the text of the NextGenPSD2 XS2A Implementation Guidelines v1.3.16 (SRC-IG).
      It is **not** a copy or modification of the Berlin Group's published OpenAPI files. Whether
      this profile may be published in this repository under the IG's CC BY-ND 4.0 licence is
      open (Q-23). Before implementation, check it for compatibility against the official
      Berlin Group file (validation report W-API-02).
    * Scope: AIS on dedicated accounts; single `sepa-credit-transfers` payments (JSON); redirect SCA.
      Everything else is unscheduled on the story map.
    * `x-delivery` names the delivery pack that first needs an operation. `x-trace` links each
      operation to its stories and example-map rules.
    * Error bodies use the NextGenPSD2 `tppMessages` variant (§4.13.3.1), per assumption A-07.
      The alternative is RFC 7807 (Q-30).
    * Authentication: mutual TLS with an eIDAS QWAC (§3). The bearer token is conditional on
      D-02/D-03 (OAuth pre-step or OAuth2 SCA approach, §4.3) and is marked so.
  license:
    name: Unresolved — see Q-23
    identifier: NOASSERTION
servers:
  - url: https://api.bank.invalid/psd2
    description: Placeholder host. The TPP-facing host is served by Finologee or the ASPSP gateway (D-05).
tags:
  - name: consents
    description: AIS consent resources (CTX-CONSENT).
  - name: authorisations
    description: Authorisation sub-resources of consents and payments (CTX-TXN-AUTHORISATION).
  - name: accounts
    description: Consented account data (CTX-ACCOUNT-INFORMATION).
  - name: payments
    description: Single payment initiations (CTX-PAYMENT-INITIATION).
security:
  - tppQwac: []
  - tppQwac: []
    bankOrTppBearer: []

paths:
  /v1/consents:
    post:
      tags: [consents]
      operationId: createConsent
      summary: Create an AIS consent on dedicated accounts (§6.3.1.1)
      x-delivery: WS-01
      x-trace:
        stories: [STORY-TPP-IDENTIFY, STORY-SCA-REDIRECT-APP, STORY-CONSENT-DEDICATED]
        rules: [R-CNS-01, R-CNS-03, R-CNS-04, R-CNS-05, R-CNS-06, R-CNS-07, R-SCA-01]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PsuIpAddressMandatory'
        - $ref: '#/components/parameters/PsuID'
        - $ref: '#/components/parameters/TppRedirectPreferred'
        - $ref: '#/components/parameters/TppRedirectUri'
        - $ref: '#/components/parameters/TppNokRedirectUri'
        - $ref: '#/components/parameters/TppExplicitAuthorisationPreferred'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
            example:
              access:
                balances: [{ iban: DE40100100103307118608 }]
                transactions: [{ iban: DE40100100103307118608 }]
              recurringIndicator: true
              validUntil: '2017-11-01'
              frequencyPerDay: 4
              combinedServiceIndicator: false
      responses:
        '201':
          description: Consent resource created (consentStatus = received).
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ASPSP-SCA-Approach: { $ref: '#/components/headers/AspspScaApproach' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentsResponse201' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '405': { $ref: '#/components/responses/Error405' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/consents/{consentId}:
    parameters:
      - $ref: '#/components/parameters/ConsentIdPath'
    get:
      tags: [consents]
      operationId: getConsentInformation
      summary: Read the consent object (§6.3.3)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-TPP-RESOURCE-ISOLATION, STORY-CONSENT-READ], rules: [R-CNS-05, R-TPP-03, R-TPP-04] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The consent as stored, including an adjusted validUntil.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentInformationResponse200' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [consents]
      operationId: deleteConsent
      summary: Terminate the consent (§6.4)
      x-delivery: WS-01
      x-trace: { stories: [STORY-CONSENT-DELETE], rules: [] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '204':
          description: Deleted; consentStatus becomes terminatedByTpp.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/consents/{consentId}/status:
    parameters:
      - $ref: '#/components/parameters/ConsentIdPath'
    get:
      tags: [consents]
      operationId: getConsentStatus
      summary: Read the consent status (§6.3.2)
      x-delivery: WS-01
      x-trace: { stories: [STORY-CONSENT-STATUS], rules: [R-SCA-03] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Current consentStatus.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatusResponse200' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/consents/{consentId}/authorisations:
    parameters:
      - $ref: '#/components/parameters/ConsentIdPath'
    post:
      tags: [authorisations]
      operationId: startConsentAuthorisation
      summary: Explicitly start an authorisation of the consent (§7.1)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-SCA-REDIRECT-APP], rules: [R-SCA-01, R-REV-03] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/TppRedirectUri'
        - $ref: '#/components/parameters/TppNokRedirectUri'
      responses:
        '201':
          description: Authorisation sub-resource created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ASPSP-SCA-Approach: { $ref: '#/components/headers/AspspScaApproach' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartScaprocessResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { $ref: '#/components/responses/Error409' }
    get:
      tags: [authorisations]
      operationId: getConsentAuthorisations
      summary: List the authorisation sub-resources of the consent (§7.4)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-SCA-STATUS], rules: [] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Authorisation ids.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Authorisations' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /v1/consents/{consentId}/authorisations/{authorisationId}:
    parameters:
      - $ref: '#/components/parameters/ConsentIdPath'
      - $ref: '#/components/parameters/AuthorisationIdPath'
    get:
      tags: [authorisations]
      operationId: getConsentScaStatus
      summary: Read the SCA status of a consent authorisation (§7.5)
      x-delivery: WS-01
      x-trace: { stories: [STORY-SCA-STATUS, STORY-SCA-REDIRECT-APP], rules: [R-SCA-03] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Current scaStatus.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScaStatusResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    put:
      tags: [authorisations]
      operationId: updateConsentsPsuData
      summary: Send the confirmation code after redirect (§7.6.4) — only if the bank adopts the confirmation step (Q-34)
      x-delivery: MVP-01
      x-conditional-on: Q-34
      x-trace: { stories: [STORY-SCA-REDIRECT-APP, STORY-SCA-CONFIRMATION], rules: [R-SCA-05] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionAuthorisationConfirmation' }
      responses:
        '200':
          description: finalised or failed.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScaStatusResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409': { $ref: '#/components/responses/Error409' }

  /v1/accounts:
    get:
      tags: [accounts]
      operationId: getAccountList
      summary: Read the accounts the consent covers (§6.5.1)
      x-delivery: WS-01
      x-trace: { stories: [STORY-PSU-REVOKE, STORY-CONSENT-EXPIRY, STORY-READ-ACCOUNT-LIST], rules: [R-ACC-01, R-ACC-02, R-ACC-04, R-CNS-02, R-REV-02] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/ConsentIDHeader'
        - $ref: '#/components/parameters/PsuIpAddressConditional'
        - $ref: '#/components/parameters/WithBalance'
      responses:
        '200':
          description: Accessible accounts; an empty array when none is accessible.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/accounts/{account-id}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      tags: [accounts]
      operationId: readAccountDetails
      summary: Read one consented account (§6.5.2)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-ENFORCE-FREQUENCY, STORY-READ-ACCOUNT-DETAILS], rules: [R-ACC-03, R-FRQ-01] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/ConsentIDHeader'
        - $ref: '#/components/parameters/PsuIpAddressConditional'
        - $ref: '#/components/parameters/WithBalance'
      responses:
        '200':
          description: Account details.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { $ref: '#/components/schemas/AccountDetails' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/accounts/{account-id}/balances:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      tags: [accounts]
      operationId: getBalances
      summary: Read balances of a consented account (§6.5.3)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-READ-BALANCES, STORY-ENFORCE-FREQUENCY], rules: [R-FRQ-01, R-FRQ-02, R-FRQ-03] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/ConsentIDHeader'
        - $ref: '#/components/parameters/PsuIpAddressConditional'
      responses:
        '200':
          description: Balances.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadAccountBalanceResponse200' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/accounts/{account-id}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      tags: [accounts]
      operationId: getTransactionList
      summary: Read transactions of a consented account (§6.5.4) — JSON only (A-06)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-READ-TRANSACTIONS, STORY-ENFORCE-FREQUENCY], rules: [R-FRQ-01] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/ConsentIDHeader'
        - $ref: '#/components/parameters/PsuIpAddressConditional'
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date }
        - name: bookingStatus
          in: query
          required: true
          schema: { type: string, enum: [booked, pending, both] }
        - $ref: '#/components/parameters/WithBalance'
      responses:
        '200':
          description: Transaction report.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionsResponse200Json' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '406': { $ref: '#/components/responses/Error406' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/payments/{payment-product}:
    parameters:
      - $ref: '#/components/parameters/PaymentProduct'
    post:
      tags: [payments]
      operationId: initiatePayment
      summary: Initiate a single SEPA credit transfer, JSON (§5.3.1)
      x-delivery: WS-01
      x-trace: { stories: [STORY-TPP-IDENTIFY, STORY-TPP-ROLE-CHECK, STORY-PIS-INITIATE-SCT], rules: [R-PIS-01, R-PIS-02, R-PIS-03, R-TPP-02] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PsuIpAddressMandatory'
        - $ref: '#/components/parameters/PsuID'
        - $ref: '#/components/parameters/TppRedirectPreferred'
        - $ref: '#/components/parameters/TppRedirectUri'
        - $ref: '#/components/parameters/TppNokRedirectUri'
        - $ref: '#/components/parameters/TppExplicitAuthorisationPreferred'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInitiationSctJson' }
            example:
              instructedAmount: { currency: EUR, amount: '123.50' }
              debtorAccount: { iban: DE40100100103307118608 }
              creditorName: Merchant123
              creditorAccount: { iban: DE02100100109307118603 }
              remittanceInformationUnstructured: Ref Number Merchant
      responses:
        '201':
          description: Payment initiation resource created (transactionStatus = RCVD).
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ASPSP-SCA-Approach: { $ref: '#/components/headers/AspspScaApproach' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInitationRequestResponse201' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/payments/{payment-product}/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/PaymentProduct'
      - $ref: '#/components/parameters/PaymentIdPath'
    get:
      tags: [payments]
      operationId: getPaymentInformation
      summary: Read the payment initiation (§5.6)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-PIS-READ-PAYMENT], rules: [R-PIS-04] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The payment as submitted, with its transactionStatus.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaymentInitiationSctJson'
                  - type: object
                    required: [transactionStatus]
                    properties:
                      transactionStatus: { $ref: '#/components/schemas/TransactionStatus' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/payments/{payment-product}/{paymentId}/status:
    parameters:
      - $ref: '#/components/parameters/PaymentProduct'
      - $ref: '#/components/parameters/PaymentIdPath'
    get:
      tags: [payments]
      operationId: getPaymentInitiationStatus
      summary: Read the transaction status (§5.4) — 200 even when the payment failed (§4.12)
      x-delivery: WS-01
      x-trace: { stories: [STORY-PIS-STATUS, STORY-PIS-SCA-TIMEOUT], rules: [R-PST-01, R-PST-02, R-PST-03, R-PST-04, R-PIS-04] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Current transactionStatus.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInitiationStatusResponse200Json' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/payments/{payment-product}/{paymentId}/authorisations:
    parameters:
      - $ref: '#/components/parameters/PaymentProduct'
      - $ref: '#/components/parameters/PaymentIdPath'
    post:
      tags: [authorisations]
      operationId: startPaymentAuthorisation
      summary: Explicitly start an authorisation of the payment (§7.1)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-PIS-SCA-REDIRECT-APP], rules: [] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/TppRedirectUri'
        - $ref: '#/components/parameters/TppNokRedirectUri'
      responses:
        '201':
          description: Authorisation sub-resource created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ASPSP-SCA-Approach: { $ref: '#/components/headers/AspspScaApproach' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartScaprocessResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { $ref: '#/components/responses/Error409' }
    get:
      tags: [authorisations]
      operationId: getPaymentInitiationAuthorisation
      summary: List the authorisation sub-resources of the payment (§7.4)
      x-delivery: MVP-01
      x-trace: { stories: [STORY-SCA-STATUS], rules: [] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Authorisation ids.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Authorisations' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /v1/payments/{payment-product}/{paymentId}/authorisations/{authorisationId}:
    parameters:
      - $ref: '#/components/parameters/PaymentProduct'
      - $ref: '#/components/parameters/PaymentIdPath'
      - $ref: '#/components/parameters/AuthorisationIdPath'
    get:
      tags: [authorisations]
      operationId: getPaymentInitiationScaStatus
      summary: Read the SCA status of a payment authorisation (§7.5)
      x-delivery: WS-01
      x-trace: { stories: [STORY-PIS-SCA-REDIRECT-APP, STORY-SCA-STATUS], rules: [R-PST-02] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Current scaStatus.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScaStatusResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    put:
      tags: [authorisations]
      operationId: updatePaymentPsuData
      summary: Send the confirmation code after redirect (§7.6.4) — only if Q-34 adopts the confirmation step
      x-delivery: MVP-01
      x-conditional-on: Q-34
      x-trace: { stories: [STORY-PIS-SCA-REDIRECT-APP, STORY-SCA-CONFIRMATION], rules: [R-SCA-05] }
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionAuthorisationConfirmation' }
      responses:
        '200':
          description: finalised or failed.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScaStatusResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409': { $ref: '#/components/responses/Error409' }

components:
  securitySchemes:
    tppQwac:
      type: mutualTLS
      description: TLS 1.2+ client authentication with a qualified website authentication certificate (QWAC) carrying the TPP roles (§3). Which component validates it is open (Q-05).
    bankOrTppBearer:
      type: http
      scheme: bearer
      description: Only if OAuth2 is used as a pre-step or as the OAuth2 SCA approach (§4.3, §13.6). Issuer open (D-02).

  headers:
    Location:
      description: Location of the created resource.
      required: true
      schema: { type: string }
    XRequestID:
      description: ID of the request, echoed.
      required: true
      schema: { type: string, format: uuid }
    AspspScaApproach:
      description: SCA approach chosen by the bank; OAuth is subsumed by REDIRECT (§5.3.1).
      schema: { type: string, enum: [EMBEDDED, DECOUPLED, REDIRECT] }

  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
      example: 99391c7e-ad88-49ec-a2ad-99ddcb1f7721
    PsuIpAddressMandatory:
      name: PSU-IP-Address
      in: header
      required: true
      description: Mandatory on consent and payment creation (§5.3.1, §6.3.1.1).
      schema: { type: string }
    PsuIpAddressConditional:
      name: PSU-IP-Address
      in: header
      required: false
      description: Present if and only if the PSU actively initiated this read (§6.5.1). Drives frequency counting (R-FRQ-02).
      schema: { type: string }
    PsuID:
      name: PSU-ID
      in: header
      required: false
      description: Conditional; whether the bank mandates it is open (Q-31).
      schema: { type: string }
    ConsentIDHeader:
      name: Consent-ID
      in: header
      required: true
      schema: { type: string }
    TppRedirectPreferred:
      name: TPP-Redirect-Preferred
      in: header
      required: false
      schema: { type: boolean }
    TppRedirectUri:
      name: TPP-Redirect-URI
      in: header
      required: false
      description: Mandated for the redirect approach; should match the QWAC domain (§4.10). Kept constant for all authorisations of one transaction (INV-AUT-03).
      schema: { type: string, format: uri }
    TppNokRedirectUri:
      name: TPP-Nok-Redirect-URI
      in: header
      required: false
      schema: { type: string, format: uri }
    TppExplicitAuthorisationPreferred:
      name: TPP-Explicit-Authorisation-Preferred
      in: header
      required: false
      schema: { type: boolean }
    WithBalance:
      name: withBalance
      in: query
      required: false
      schema: { type: boolean }
    ConsentIdPath:
      name: consentId
      in: path
      required: true
      schema: { type: string }
    AuthorisationIdPath:
      name: authorisationId
      in: path
      required: true
      schema: { type: string }
    AccountIdPath:
      name: account-id
      in: path
      required: true
      description: resourceId from the account list — never an IBAN (R-ACC-03, INV-ACC-01).
      schema: { type: string }
    PaymentIdPath:
      name: paymentId
      in: path
      required: true
      schema: { type: string }
    PaymentProduct:
      name: payment-product
      in: path
      required: true
      description: MVP offers sepa-credit-transfers only (Q-13); others answer 404 PRODUCT_UNKNOWN (R-PIS-03).
      schema: { type: string, enum: [sepa-credit-transfers] }

  responses:
    Error400:
      description: e.g. FORMAT_ERROR, CONSENT_UNKNOWN (header), SESSIONS_NOT_SUPPORTED, SCA_INVALID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error401:
      description: e.g. CERTIFICATE_*, ROLE_INVALID, CONSENT_INVALID, CONSENT_EXPIRED, TOKEN_*.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error403:
      description: e.g. CONSENT_UNKNOWN (path), RESOURCE_UNKNOWN, RESOURCE_EXPIRED, PRODUCT_INVALID, SERVICE_BLOCKED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error404:
      description: e.g. RESOURCE_UNKNOWN (account-id in path), PRODUCT_UNKNOWN.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error405:
      description: SERVICE_INVALID (HTTP method).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error406:
      description: REQUESTED_FORMATS_INVALID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error409:
      description: STATUS_INVALID — the resource does not allow additional authorisation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Error429:
      description: ACCESS_EXCEEDED — unattended reads above frequencyPerDay (INV-ACC-03).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Iban:
      type: string
      pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{1,30}$'
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
    Amount:
      type: object
      required: [currency, amount]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        amount: { type: string, description: 'Decimal string, e.g. "123.50" (§14.3).' }
    AccountReference:
      type: object
      description: Exactly one identifier is used (§14.19). MVP proposes iban (A-13).
      properties:
        iban: { $ref: '#/components/schemas/Iban' }
        bban: { type: string }
        pan: { type: string, maxLength: 35 }
        maskedPan: { type: string, maxLength: 35 }
        msisdn: { type: string, maxLength: 35 }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    AccountAccess:
      type: object
      description: Dedicated-account consent — every used list is non-empty (R-CNS-01, INV-CNS-02).
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/AccountReference' } }
        balances: { type: array, items: { $ref: '#/components/schemas/AccountReference' } }
        transactions: { type: array, items: { $ref: '#/components/schemas/AccountReference' } }
    ConsentStatus:
      type: string
      enum: [received, rejected, valid, revokedByPsu, expired, terminatedByTpp, partiallyAuthorised]
    ScaStatus:
      type: string
      enum: [received, psuIdentified, psuAuthenticated, scaMethodSelected, started, unconfirmed, finalised, failed, exempted]
    TransactionStatus:
      type: string
      enum: [ACCC, ACCP, ACSC, ACSP, ACTC, ACWC, ACWP, RCVD, PDNG, RJCT, CANC, ACFC, PATC, PART, RVCM, RVNC, RCVC]
    HrefType:
      type: object
      required: [href]
      properties:
        href: { type: string }
    Links:
      type: object
      description: Steering hyperlinks (§4.15, §14.6).
      additionalProperties: { $ref: '#/components/schemas/HrefType' }
      properties:
        scaRedirect: { $ref: '#/components/schemas/HrefType' }
        scaOAuth: { $ref: '#/components/schemas/HrefType' }
        confirmation: { $ref: '#/components/schemas/HrefType' }
        startAuthorisation: { $ref: '#/components/schemas/HrefType' }
        self: { $ref: '#/components/schemas/HrefType' }
        status: { $ref: '#/components/schemas/HrefType' }
        scaStatus: { $ref: '#/components/schemas/HrefType' }
        account: { $ref: '#/components/schemas/HrefType' }
        balances: { $ref: '#/components/schemas/HrefType' }
        transactions: { $ref: '#/components/schemas/HrefType' }
    TppMessage:
      type: object
      required: [category, code]
      properties:
        category: { type: string, enum: [ERROR, WARNING] }
        code: { type: string, description: 'Message code (§14.11).' }
        path: { type: string }
        text: { type: string, maxLength: 500 }
    Error:
      type: object
      description: NextGenPSD2 variant (§4.13.3.1) per A-07; RFC 7807 alternative open (Q-30).
      properties:
        tppMessages: { type: array, items: { $ref: '#/components/schemas/TppMessage' } }
        _links: { $ref: '#/components/schemas/Links' }
    ConsentRequest:
      type: object
      required: [access, recurringIndicator, validUntil, frequencyPerDay, combinedServiceIndicator]
      properties:
        access: { $ref: '#/components/schemas/AccountAccess' }
        recurringIndicator: { type: boolean }
        validUntil: { type: string, format: date, description: '9999-12-31 asks for the maximum (R-CNS-05).' }
        frequencyPerDay: { type: integer, minimum: 1, description: '<= 4 unless bilaterally agreed (R-CNS-03).' }
        combinedServiceIndicator: { type: boolean, description: 'true is refused with SESSIONS_NOT_SUPPORTED (R-CNS-07).' }
    ConsentsResponse201:
      type: object
      required: [consentStatus, consentId, _links]
      properties:
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        consentId: { type: string }
        _links: { $ref: '#/components/schemas/Links' }
        psuMessage: { type: string, maxLength: 500 }
        tppMessages: { type: array, items: { $ref: '#/components/schemas/TppMessage' } }
    ConsentInformationResponse200:
      type: object
      required: [access, recurringIndicator, validUntil, frequencyPerDay, lastActionDate, consentStatus]
      properties:
        access: { $ref: '#/components/schemas/AccountAccess' }
        recurringIndicator: { type: boolean }
        validUntil: { type: string, format: date }
        frequencyPerDay: { type: integer }
        lastActionDate: { type: string, format: date }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        _links: { $ref: '#/components/schemas/Links' }
    ConsentStatusResponse200:
      type: object
      required: [consentStatus]
      properties:
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        psuMessage: { type: string, maxLength: 500 }
    StartScaprocessResponse:
      type: object
      required: [scaStatus, authorisationId, _links]
      properties:
        scaStatus: { $ref: '#/components/schemas/ScaStatus' }
        authorisationId: { type: string }
        _links: { $ref: '#/components/schemas/Links' }
        psuMessage: { type: string, maxLength: 500 }
    Authorisations:
      type: object
      required: [authorisationIds]
      properties:
        authorisationIds: { type: array, items: { type: string } }
    ScaStatusResponse:
      type: object
      required: [scaStatus]
      properties:
        scaStatus: { $ref: '#/components/schemas/ScaStatus' }
        _links: { $ref: '#/components/schemas/Links' }
        psuMessage: { type: string, maxLength: 512 }
    TransactionAuthorisationConfirmation:
      type: object
      required: [confirmationCode]
      properties:
        confirmationCode: { type: string }
    Balance:
      type: object
      required: [balanceAmount, balanceType]
      properties:
        balanceAmount: { $ref: '#/components/schemas/Amount' }
        balanceType:
          type: string
          enum: [closingBooked, expected, openingBooked, interimAvailable, interimBooked, forwardAvailable, nonInvoiced]
        creditLimitIncluded: { type: boolean }
        lastChangeDateTime: { type: string, format: date-time }
        referenceDate: { type: string, format: date }
    AccountDetails:
      type: object
      required: [currency]
      properties:
        resourceId: { type: string }
        iban: { $ref: '#/components/schemas/Iban' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        name: { type: string, maxLength: 70 }
        displayName: { type: string, maxLength: 70 }
        product: { type: string, maxLength: 35 }
        cashAccountType: { type: string }
        status: { type: string, enum: [enabled, deleted, blocked] }
        usage: { type: string, enum: [PRIV, ORGA] }
        balances: { type: array, items: { $ref: '#/components/schemas/Balance' } }
        _links: { $ref: '#/components/schemas/Links' }
    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/AccountDetails' } }
    ReadAccountBalanceResponse200:
      type: object
      required: [balances]
      properties:
        account: { $ref: '#/components/schemas/AccountReference' }
        balances: { type: array, items: { $ref: '#/components/schemas/Balance' } }
    TransactionDetails:
      type: object
      description: Minimal subset of §14.25 for the MVP; the full structure is a compatibility item (W-API-02).
      required: [transactionAmount]
      properties:
        transactionId: { type: string }
        entryReference: { type: string, maxLength: 35 }
        bookingDate: { type: string, format: date }
        valueDate: { type: string, format: date }
        transactionAmount: { $ref: '#/components/schemas/Amount' }
        creditorName: { type: string, maxLength: 70 }
        creditorAccount: { $ref: '#/components/schemas/AccountReference' }
        debtorName: { type: string, maxLength: 70 }
        debtorAccount: { $ref: '#/components/schemas/AccountReference' }
        remittanceInformationUnstructured: { type: string, maxLength: 140 }
    TransactionsResponse200Json:
      type: object
      properties:
        account: { $ref: '#/components/schemas/AccountReference' }
        transactions:
          type: object
          properties:
            booked: { type: array, items: { $ref: '#/components/schemas/TransactionDetails' } }
            pending: { type: array, items: { $ref: '#/components/schemas/TransactionDetails' } }
            _links: { $ref: '#/components/schemas/Links' }
        balances: { type: array, items: { $ref: '#/components/schemas/Balance' } }
    PaymentInitiationSctJson:
      type: object
      required: [instructedAmount, creditorAccount, creditorName]
      properties:
        endToEndIdentification: { type: string, maxLength: 35 }
        debtorAccount: { $ref: '#/components/schemas/AccountReference' }
        instructedAmount: { $ref: '#/components/schemas/Amount' }
        creditorAccount: { $ref: '#/components/schemas/AccountReference' }
        creditorName: { type: string, maxLength: 70 }
        remittanceInformationUnstructured: { type: string, maxLength: 140 }
        requestedExecutionDate: { type: string, format: date, description: 'Future-dated payments open (Q-13).' }
    PaymentInitationRequestResponse201:
      type: object
      required: [transactionStatus, paymentId, _links]
      properties:
        transactionStatus: { $ref: '#/components/schemas/TransactionStatus' }
        paymentId: { type: string }
        _links: { $ref: '#/components/schemas/Links' }
        psuMessage: { type: string, maxLength: 500 }
        tppMessages: { type: array, items: { $ref: '#/components/schemas/TppMessage' } }
    PaymentInitiationStatusResponse200Json:
      type: object
      required: [transactionStatus]
      properties:
        transactionStatus: { $ref: '#/components/schemas/TransactionStatus' }
        fundsAvailable: { type: boolean }
        psuMessage: { type: string, maxLength: 500 }
        tppMessages: { type: array, items: { $ref: '#/components/schemas/TppMessage' } }
        _links: { $ref: '#/components/schemas/Links' }
