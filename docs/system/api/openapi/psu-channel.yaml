openapi: 3.1.0
info:
  title: PSU channel API — consent-screen backend and app last-factor prompt (proposal)
  version: 0.1.0-proposal
  summary: Serves the PSU-facing read models of the consent screen and of the app's last-factor prompt, and takes the PSU's approve, decline and revoke decisions.
  description: |
    PROPOSAL generated by AI on 2026-09-19, iteration 2 (interface id `API-PSU-CHANNEL`,
    component `CMP-PSU-CHANNEL-API`). Internal to the bank — never exposed to TPPs.

    Every response schema **is** a read model defined in docs/journeys/service-blueprint.md
    (`x-read-model`). Every operation traces to the screen that calls it (`x-screens`) and to
    its stories (`x-trace`).

    Iteration 3 (SRC-ADR 87c72b8): approval and revocation happen on the **consent screen**, whose
    frontend and backend are provided by the ASPSP gateway **or** Finologee (D-01). The operations
    tagged `x-conditional-on: D-01` exist only if D-01 goes in-house; otherwise Finologee provides
    the equivalent. The mobile app carries only the last SCA factor; `getLastFactorPrompt` serves
    it (or Transmit does, depending on Q-45 / D-10). The cross-TPP `listTppAccess` operation was
    removed: no channel shows all TPPs any more (Q-43).

    Open points that shape this contract:
    * D-01 (where the consent and the consent screen live) — this contract is the in-house option.
    * D-10 / Q-45 / Q-07 (factor split, app trigger, session tokens).
    * Q-43, Q-44, Q-46, Q-47 (consent screen reach, embedding, payments, domain) and Q-35…Q-41 (screen content).
  license:
    name: Internal
    identifier: NOASSERTION
servers:
  - url: https://psu-channel.bank.invalid
    description: Placeholder — internal host.
tags:
  - name: approvals
    description: Approval requests behind a TPP's consent or payment authorisation (CTX-TXN-AUTHORISATION).
  - name: tpp-access
    description: The PSU's view of one TPP's access, on the consent screen (CTX-CONSENT).
  - name: last-factor
    description: The bank app's last-factor prompt (SRC-ADR 87c72b8).
security:
  - consentScreenSession: []

paths:
  /psu/v1/redirect-sessions/{redirectToken}:
    parameters:
      - $ref: '#/components/parameters/RedirectToken'
    get:
      tags: [approvals]
      operationId: resolveRedirectSession
      summary: Resolve an scaRedirect token into the approval request it points at
      description: Used by the consent screen when the PSU arrives from scaRedirect. Does not consume the token; `decideApprovalRequest` does.
      security: []
      x-delivery: WS-01
      x-conditional-on: D-01
      x-screens: [SCR-CONSENT-IDENTIFY, SCR-CONSENT-UNAVAILABLE]
      x-read-model: RM-REDIRECT-SESSION
      x-trace: { stories: [STORY-SCA-REDIRECT-APP, STORY-PIS-SCA-REDIRECT-APP, STORY-SCA-REQUEST-UNAVAILABLE], rules: [R-SCA-05] }
      responses:
        '200':
          description: The request is open; show SCR-CONSENT-IDENTIFY.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectSession' }
        '410':
          description: Unknown, expired or already used — show SCR-CONSENT-UNAVAILABLE with a way back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }

  /psu/v1/approvals/{authorisationId}:
    parameters:
      - $ref: '#/components/parameters/AuthorisationId'
    get:
      tags: [approvals]
      operationId: getApprovalRequest
      summary: What the PSU is asked to approve (consent or payment)
      x-delivery: WS-01
      x-conditional-on: D-01
      x-screens: [SCR-CONSENT-ACCESS, SCR-CONSENT-PAYMENT, SCR-CONSENT-UNAVAILABLE]
      x-read-model: RM-CONSENT-APPROVAL | RM-PAYMENT-APPROVAL
      x-trace:
        stories: [STORY-SCA-REDIRECT-APP, STORY-SCA-CONSENT-DETAILS, STORY-PIS-SCA-REDIRECT-APP, STORY-SCA-REQUEST-UNAVAILABLE]
        rules: [R-SCA-02, R-PIS-05]
      responses:
        '200':
          description: The approval request, with a subjectDigest that the decision must echo (INV-AUT-05).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConsentApproval'
                  - $ref: '#/components/schemas/PaymentApproval'
                discriminator:
                  propertyName: purpose
                  mapping:
                    consent: '#/components/schemas/ConsentApproval'
                    payment: '#/components/schemas/PaymentApproval'
        '403':
          description: The authenticated PSU is not the PSU of this request.
        '410':
          description: Final or past its SCA window — show SCR-CONSENT-UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }

  /psu/v1/approvals/{authorisationId}/decision:
    parameters:
      - $ref: '#/components/parameters/AuthorisationId'
    post:
      tags: [approvals]
      operationId: decideApprovalRequest
      summary: Record the PSU's approve or decline on the consent screen, bound to the subject shown; an approval triggers the last factor in the app
      x-delivery: WS-01
      x-conditional-on: D-01
      x-screens: [SCR-CONSENT-ACCESS, SCR-CONSENT-PAYMENT, SCR-CONSENT-AWAIT-APP]
      x-read-model: RM-AUTHORISATION-OUTCOME
      x-trace:
        stories: [STORY-SCA-REDIRECT-APP, STORY-PIS-SCA-REDIRECT-APP, STORY-SCA-OUTCOME]
        rules: [R-SCA-03, R-SCA-04, R-SCA-05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: Decision recorded. On decline the final outcome; on approve `pendingLastFactor` — show SCR-CONSENT-AWAIT-APP and poll `getAuthorisationOutcome`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }
        '409':
          description: subjectDigest does not match what is now bound, or the authorisation is already final (INV-AUT-01, INV-AUT-05).
        '410':
          description: SCA window passed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }

  /psu/v1/approvals/{authorisationId}/outcome:
    parameters:
      - $ref: '#/components/parameters/AuthorisationId'
    get:
      tags: [approvals]
      operationId: getAuthorisationOutcome
      summary: Outcome of an approval request, polled while the PSU confirms in the app
      x-delivery: WS-01
      x-conditional-on: D-01
      x-screens: [SCR-CONSENT-AWAIT-APP, SCR-CONSENT-OUTCOME]
      x-read-model: RM-AUTHORISATION-OUTCOME
      x-trace: { stories: [STORY-SCA-REDIRECT-APP, STORY-PIS-SCA-REDIRECT-APP, STORY-SCA-OUTCOME], rules: [R-SCA-03, R-SCA-04] }
      responses:
        '200':
          description: Current outcome; `pendingLastFactor` until the app confirms, rejects or the SCA window closes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }
        '403':
          description: The consent-screen session is not the PSU of this request.

  /psu/v1/last-factor-prompts/{authorisationId}:
    parameters:
      - $ref: '#/components/parameters/AuthorisationId'
    get:
      tags: [last-factor]
      operationId: getLastFactorPrompt
      summary: What the bank app shows when it asks the PSU for the last factor
      description: Served here or by Transmit, depending on how the app is triggered (Q-45, D-10). For a payment it carries amount and payee (dynamic linking; whether the prompt repeats them is open, Q-46).
      security:
        - bankAppSession: []
      x-delivery: WS-01
      x-conditional-on: Q-45
      x-screens: [SCR-APP-LAST-FACTOR]
      x-read-model: RM-LAST-FACTOR-PROMPT
      x-trace: { stories: [STORY-SCA-REDIRECT-APP, STORY-PIS-SCA-REDIRECT-APP], rules: [R-PIS-05] }
      responses:
        '200':
          description: The prompt, with the approved-subject digest the SCA result must bind (INV-AUT-05).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LastFactorPrompt' }
        '401':
          description: App session missing or invalid.
        '410':
          description: Request already final or past its SCA window.

  /psu/v1/tpp-access/{consentId}:
    parameters:
      - $ref: '#/components/parameters/ConsentId'
    get:
      tags: [tpp-access]
      operationId: getTppAccess
      summary: The PSU's access for the TPP whose application hosts the consent screen (how the PSU gets there — Q-43)
      x-delivery: MVP-01
      x-conditional-on: D-01
      x-screens: [SCR-CONSENT-MANAGE, SCR-CONSENT-REVOKE-CONFIRM]
      x-read-model: RM-PSU-TPP-ACCESS
      x-trace: { stories: [STORY-PSU-REVOKE], rules: [R-REV-04] }
      responses:
        '200':
          description: The access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TppAccess' }
        '404':
          description: Not a consent of this PSU (R-REV-01 edge case).

  /psu/v1/tpp-access/{consentId}/revocation:
    parameters:
      - $ref: '#/components/parameters/ConsentId'
    post:
      tags: [tpp-access]
      operationId: revokeTppAccess
      summary: Withdraw a TPP's access (consentStatus → revokedByPsu)
      x-delivery: MVP-01
      x-conditional-on: D-01
      x-screens: [SCR-CONSENT-REVOKE-CONFIRM]
      x-read-model: RM-PSU-TPP-ACCESS
      x-trace: { stories: [STORY-PSU-REVOKE], rules: [R-REV-01, R-REV-02, R-REV-03] }
      responses:
        '200':
          description: Revoked; the access as it now stands (status revokedByPsu). The TPP's next read is refused (RM-ACCESS-DECISION).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TppAccess' }
        '404':
          description: Not a consent of this PSU.
        '409':
          description: Not in a revocable status (open question in EXMAP-PSU-REVOKE R-REV-01).

components:
  securitySchemes:
    consentScreenSession:
      type: http
      scheme: bearer
      description: Session of the PSU on the consent screen after the first factor(s) (Q-45). Issuer open (Q-07).
    bankAppSession:
      type: http
      scheme: bearer
      description: Bank token of the PSU's app session on the registered device (Q-07, D-10).

  parameters:
    RedirectToken:
      name: redirectToken
      in: path
      required: true
      description: Opaque, single-use token carried in the scaRedirect link. Never the authorisationId.
      schema: { type: string }
    AuthorisationId:
      name: authorisationId
      in: path
      required: true
      schema: { type: string }
    ConsentId:
      name: consentId
      in: path
      required: true
      schema: { type: string }

  schemas:
    Tpp:
      type: object
      required: [legalName]
      properties:
        legalName: { type: string, description: 'Organisation name from the TPP certificate.' }
        brandName: { type: string, description: 'Only if the bank decides to show a brand (Q-38).' }
        roles: { type: array, items: { type: string, enum: [PSP_AI, PSP_PI, PSP_IC, PSP_AS] } }
    AccountLabel:
      type: object
      description: How an account is shown to the PSU (Q-37).
      required: [displayIdentifier, currency]
      properties:
        displayIdentifier: { type: string, description: 'e.g. masked IBAN "DE40 …8608".' }
        name: { type: string }
        product: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        heldByPsu: { type: boolean, description: 'false triggers the Q-35 handling on the approval screen.' }
    Amount:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount: { type: string }
    RedirectSession:
      type: object
      x-read-model: RM-REDIRECT-SESSION
      required: [authorisationId, purpose, deadline]
      properties:
        authorisationId: { type: string }
        purpose: { type: string, enum: [consent, payment] }
        deadline: { type: string, format: date-time, description: 'End of the SCA window (Q-29).' }
    ApprovalBase:
      type: object
      required: [authorisationId, purpose, tpp, deadline, subjectDigest]
      properties:
        authorisationId: { type: string }
        purpose: { type: string, enum: [consent, payment] }
        tpp: { $ref: '#/components/schemas/Tpp' }
        deadline: { type: string, format: date-time }
        subjectDigest: { type: string, description: 'Digest of exactly the data shown; echoed by the decision (INV-AUT-05).' }
    ConsentApproval:
      x-read-model: RM-CONSENT-APPROVAL
      allOf:
        - $ref: '#/components/schemas/ApprovalBase'
        - type: object
          required: [accounts, recurring, validUntil, frequencyPerDay]
          properties:
            accounts:
              type: array
              items:
                type: object
                required: [account, access]
                properties:
                  account: { $ref: '#/components/schemas/AccountLabel' }
                  access:
                    type: array
                    items: { type: string, enum: [accountDetails, balances, transactions] }
            recurring: { type: boolean }
            validUntil: { type: string, format: date, description: 'As granted by the bank (INV-CNS-05).' }
            frequencyPerDay: { type: integer, minimum: 1 }
    PaymentApproval:
      x-read-model: RM-PAYMENT-APPROVAL
      allOf:
        - $ref: '#/components/schemas/ApprovalBase'
        - type: object
          required: [instructedAmount, creditorName, creditorAccount]
          properties:
            instructedAmount: { $ref: '#/components/schemas/Amount' }
            creditorName: { type: string }
            creditorAccount: { type: string, description: 'Payee IBAN, shown in full.' }
            debtorAccount: { $ref: '#/components/schemas/AccountLabel' }
            remittanceInformationUnstructured: { type: string }
            requestedExecutionDate: { type: string, format: date }
            fees: { $ref: '#/components/schemas/Amount', description: 'Only if Q-41 decides to show fees.' }
    Decision:
      type: object
      required: [decision, subjectDigest]
      properties:
        decision: { type: string, enum: [approve, decline] }
        subjectDigest: { type: string, description: 'Must equal the digest returned by getApprovalRequest.' }
        scaResult: { type: string, description: 'Authentication result / signed assertion from the SCA journey (format per Q-07).' }
    AuthorisationOutcome:
      type: object
      x-read-model: RM-AUTHORISATION-OUTCOME
      required: [outcome, returnUri]
      properties:
        purpose: { type: string, enum: [consent, payment] }
        outcome: { type: string, enum: [pendingLastFactor, approved, declined, failed, expired, alreadyHandled, unknown] }
        tpp: { $ref: '#/components/schemas/Tpp' }
        returnUri: { type: string, format: uri, description: 'TPP-Redirect-URI on approval, TPP-Nok-Redirect-URI (if given) otherwise (INV-AUT-03).' }
    LastFactorPrompt:
      type: object
      x-read-model: RM-LAST-FACTOR-PROMPT
      required: [authorisationId, purpose, tpp, requestedAt, subjectDigest]
      properties:
        authorisationId: { type: string }
        purpose: { type: string, enum: [consent, payment] }
        tpp: { $ref: '#/components/schemas/Tpp' }
        requestedAt: { type: string, format: date-time }
        consentSummary:
          type: object
          properties:
            accountCount: { type: integer }
            validUntil: { type: string, format: date }
        paymentSummary:
          type: object
          description: Amount and payee for dynamic linking (Q-46).
          properties:
            instructedAmount: { $ref: '#/components/schemas/Amount' }
            creditorName: { type: string }
            creditorAccount: { type: string }
        subjectDigest: { type: string }
    TppAccess:
      type: object
      x-read-model: RM-PSU-TPP-ACCESS
      required: [consentId, tpp, accounts, status, validUntil]
      properties:
        consentId: { type: string }
        tpp: { $ref: '#/components/schemas/Tpp' }
        accounts:
          type: array
          items:
            type: object
            required: [account, access]
            properties:
              account: { $ref: '#/components/schemas/AccountLabel' }
              access:
                type: array
                items: { type: string, enum: [accountDetails, balances, transactions] }
        status: { type: string, enum: [valid, revokedByPsu, expired, terminatedByTpp] }
        grantedOn: { type: string, format: date }
        validUntil: { type: string, format: date }
        recurring: { type: boolean }
        frequencyPerDay: { type: integer }
        lastReadAt: { type: string, format: date-time, description: 'Only if Q-40 decides to show it.' }
