asyncapi: 3.0.0
info:
  title: XS2A domain events (internal, proposal)
  version: 0.1.0-proposal
  description: |
    PROPOSAL generated by AI (interface id `API-XS2A-EVENTS`). Internal only —
    never exposed to TPPs.

    Justification: consent and payment status follow authorisation outcomes across bounded
    contexts (policies in docs/journeys/ais-consent-lifecycle.eventstorm and
    pis-payment-initiation.eventstorm), and status changes feed audit and metrics (OBJ-04).

    **Conditional on D-04.** If the modules are co-deployed in one ASPSP gateway (D-06), the
    authorisation-to-consent/payment hand-off can stay in-process, and only the audit/metrics
    consumer needs this contract. The transport (Kafka, a message broker or an outbox relay) is
    not decided (Q-22). The broker below is a placeholder.
defaultContentType: application/json

servers:
  internal:
    host: events.bank.invalid
    protocol: kafka
    description: Placeholder — transport not decided (D-04, Q-22).

channels:
  authorisationStatusChanged:
    address: xs2a.authorisation.status-changed
    description: An authorisation sub-resource reached a new scaStatus (CTX-TXN-AUTHORISATION, INV-AUT-01).
    messages:
      AuthorisationStatusChanged:
        $ref: '#/components/messages/AuthorisationStatusChanged'
  consentStatusChanged:
    address: xs2a.consent.status-changed
    description: A consent reached a new consentStatus (CTX-CONSENT, INV-CNS-01).
    messages:
      ConsentStatusChanged:
        $ref: '#/components/messages/ConsentStatusChanged'
  paymentStatusChanged:
    address: xs2a.payment.status-changed
    description: A payment initiation reached a new transactionStatus (CTX-PAYMENT-INITIATION, INV-PAY-02).
    messages:
      PaymentStatusChanged:
        $ref: '#/components/messages/PaymentStatusChanged'

operations:
  publishAuthorisationStatusChanged:
    action: send
    channel: { $ref: '#/channels/authorisationStatusChanged' }
    summary: Published by CMP-AUTHORISATION.
    messages:
      - $ref: '#/channels/authorisationStatusChanged/messages/AuthorisationStatusChanged'
  consentReactsToAuthorisation:
    action: receive
    channel: { $ref: '#/channels/authorisationStatusChanged' }
    summary: CMP-CONSENT — "Whenever the authorisation of a consent is finalised, make the consent valid".
    messages:
      - $ref: '#/channels/authorisationStatusChanged/messages/AuthorisationStatusChanged'
  paymentReactsToAuthorisation:
    action: receive
    channel: { $ref: '#/channels/authorisationStatusChanged' }
    summary: CMP-PAYMENT — "Whenever the authorisation of a payment is finalised, submit the payment for execution".
    messages:
      - $ref: '#/channels/authorisationStatusChanged/messages/AuthorisationStatusChanged'
  publishConsentStatusChanged:
    action: send
    channel: { $ref: '#/channels/consentStatusChanged' }
    summary: Published by CMP-CONSENT; consumed by audit/metrics (CMP-OBSERVABILITY).
    messages:
      - $ref: '#/channels/consentStatusChanged/messages/ConsentStatusChanged'
  publishPaymentStatusChanged:
    action: send
    channel: { $ref: '#/channels/paymentStatusChanged' }
    summary: Published by CMP-PAYMENT; consumed by audit/metrics (CMP-OBSERVABILITY).
    messages:
      - $ref: '#/channels/paymentStatusChanged/messages/PaymentStatusChanged'

components:
  messages:
    AuthorisationStatusChanged:
      name: AuthorisationStatusChanged
      payload: { $ref: '#/components/schemas/AuthorisationStatusChanged' }
    ConsentStatusChanged:
      name: ConsentStatusChanged
      payload: { $ref: '#/components/schemas/ConsentStatusChanged' }
    PaymentStatusChanged:
      name: PaymentStatusChanged
      payload: { $ref: '#/components/schemas/PaymentStatusChanged' }
  schemas:
    Envelope:
      type: object
      required: [eventId, occurredAt, xRequestId, tppId]
      properties:
        eventId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        xRequestId: { type: string, format: uuid, description: X-Request-ID of the causing request, for tracing. }
        tppId: { type: string, description: organizationIdentifier of the owning TPP. }
    AuthorisationStatusChanged:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [authorisationId, purpose, subjectId, scaStatus]
          properties:
            authorisationId: { type: string }
            purpose: { type: string, enum: [consent, payment, paymentCancellation] }
            subjectId: { type: string, description: consentId or paymentId. }
            scaStatus:
              type: string
              enum: [received, psuIdentified, psuAuthenticated, scaMethodSelected, started, unconfirmed, finalised, failed, exempted]
    ConsentStatusChanged:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [consentId, consentStatus]
          properties:
            consentId: { type: string }
            consentStatus:
              type: string
              enum: [received, rejected, partiallyAuthorised, valid, revokedByPsu, expired, terminatedByTpp]
            cause:
              type: string
              enum: [authorisation, psuRevocation, tppDeletion, validityEnded, replacedByNewRecurringConsent]
    PaymentStatusChanged:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [paymentId, paymentProduct, transactionStatus]
          properties:
            paymentId: { type: string }
            paymentProduct: { type: string }
            transactionStatus:
              type: string
              enum: [RCVD, PDNG, PATC, ACTC, ACWC, ACCP, ACFC, ACSP, ACSC, ACCC, ACWP, RJCT, CANC, PART, RVCM, RVNC, RCVC]
