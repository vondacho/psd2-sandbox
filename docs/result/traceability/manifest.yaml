# Traceability manifest — PSD2 XS2A access to account
# PROPOSAL generated by AI on 2026-09-22. Checked by docs/ai/tools/validate.py.
# Chain (docs/ai/10-artifact-contract.md): objective -> journey -> pivotal event -> story/slice
#   -> rule/example -> bounded context/invariant -> component/interface -> implementation/test
#   -> production evidence.
# "implementation" is absent on purpose: nothing is built yet. "evidence" names what WS-01 and
# MVP-01 must produce, not evidence that exists.
#
# PACK ROOT. Paths below are relative to docs/result/, which mirrors the repository layout the
# artefact contract prescribes. The pack is designed to be promoted to the repository root on
# acceptance; until then the validator is run with docs/result/ mounted as its root (see
# ../traceability/validation-report.md §1).

manifest_version: 1
generated: 2026-09-22
source_revision: 7c44c2d   # the commit this proposal was generated from
input_revisions:
  # 7c44c2d revised the ADR in four ways that moved this design: the CIAM owns the browser login
  # screen (it was the IDP); the SCA journey ends in a consent confirmation panel on the enrolled
  # device; the consent screen is managed by the TPP (it was the Bank ASPSP); and Finologee
  # manages the consent state. A token exchange from Transmit to PingFederate became a fact.
  SRC-ADR: { revised: 7c44c2d }
  SRC-IG:  { version: "1.3.16 (2025-11-27)" }

conventions:
  OBJ: objective — docs/journeys/problem-analysis.md
  ACT: actor — docs/journeys/problem-analysis.md
  JRN: journey and stage (JRN-x.Sn) — docs/journeys/journey-map.md
  EVT: pivotal event — +tag on the event card in docs/journeys/*.eventstorm
  ACTV: story-map activity — +tag on the activity in docs/stories/*.storymap
  STORY: story — +tag on the story card (the story map owns release meaning)
  EXMAP: example map — file docs/stories/<name>.examplemap, story card carries the STORY tag
  R: rule — +tag on the rule card of an example map
  CTX: bounded context — context name in docs/domain/*.ddd (see contexts below)
  INV: invariant — "[INV-...]" prefix of an invariant line in docs/domain/**/*.ddm
  CMP: component — metadata.cmp on a LikeC4 element in docs/system/c4/*.likec4
  API: interface — docs/system/api/**; operations are OpenAPI operationIds
  WS / MVP: delivery pack — docs/delivery/*.md; story-map delivery "Walking skeleton" = WS-01, "MVP" = MVP-01
  SCR: PSU-facing screen — defined in docs/journeys/service-blueprint.md; ui cards (+tag), LikeC4 metadata.scr
  RM: read model — defined in docs/journeys/service-blueprint.md; readmodel cards (+tag), LikeC4 metadata.readmodels, OpenAPI x-read-model
  EVID: expected evidence — defined in the delivery packs
  Q / A / D / H / C / RSK: ledger — docs/traceability/questions-and-assumptions.md, docs/system/README.md, docs/journeys/problem-analysis.md
  note: notation files carry ids as +tags because none of the four DSLs has another id slot;
        '#' tickets are owned by the ticketing system and are never written by this proposal.

