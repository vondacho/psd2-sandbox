asyncapi: 3.0.0
info:
  title: XS2A domain events — internal (proposal)
  version: 0.1.0-proposal
  description: |
    PROPOSAL generated by AI (interface id `API-XS2A-EVENTS`). **Internal only**: no TPP and no
    vendor consumes it. It exists for two reasons the supplied sources make explicit — auditing,
    which `SRC-ADR` names as part of consent lifecycle management, and the operational evidence
    the delivery packs ask for (`OBJ-04`).

    Conditional on `D-04`. If status changes stay in-process inside one deployable, only the
    audit and metrics stream below survives.

    The consent record is mastered at Finologee. Whether the bank can also *subscribe* to the
    vendor's own revocation and expiry events, rather than discovering them on the next read, is
    `Q-45` — and it is the difference between `RM-ACCESS-DECISION` being strongly consistent on
    revocation and merely eventually consistent (`D-01`, `H-03`).
  license:
    name: Internal proposal
servers:
  broker:
    host: broker.bank.invalid
    protocol: kafka
    description: Placeholder. The event transport is not named in the supplied context (Q-06).

channels:
  consentStatusChanged:
    address: xs2a.consent.status-changed
    messages:
      ConsentStatusChanged:
        $ref: '#/components/messages/ConsentStatusChanged'
  authorisationStatusChanged:
    address: xs2a.authorisation.status-changed
    messages:
      AuthorisationStatusChanged:
        $ref: '#/components/messages/AuthorisationStatusChanged'
  paymentStatusChanged:
    address: xs2a.payment.status-changed
    messages:
      PaymentStatusChanged:
        $ref: '#/components/messages/PaymentStatusChanged'
  accountDataRead:
    address: xs2a.account.data-read
    messages:
      AccountDataRead:
        $ref: '#/components/messages/AccountDataRead'

operations:
  publishConsentStatusChanged:
    action: send
    channel:
      $ref: '#/channels/consentStatusChanged'
  publishAuthorisationStatusChanged:
    action: send
    channel:
      $ref: '#/channels/authorisationStatusChanged'
  publishPaymentStatusChanged:
    action: send
    channel:
      $ref: '#/channels/paymentStatusChanged'
  publishAccountDataRead:
    action: send
    channel:
      $ref: '#/channels/accountDataRead'

components:
  schemas:
    Envelope:
      type: object
      required: [eventId, occurredAt, xRequestId, tppId]
      properties:
        eventId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        xRequestId:
          type: string
          format: uuid
          description: The X-Request-ID of the TPP call that caused this, so a trace joins up (EVID-WS-TRACE).
        tppId: { type: string }
        psuIdPseudonym:
          type: string
          description: Never a raw PSU identifier on the bus.
  messages:
    ConsentStatusChanged:
      name: ConsentStatusChanged
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            required: [consentId, newStatus]
            properties:
              consentId: { type: string }
              previousStatus: { type: string }
              newStatus: { type: string }
              reason:
                type: string
                enum: [authorised, rejected, expired, terminatedByTpp, revokedByPsu, replacedByNewRecurringConsent]
                description: replacedByNewRecurringConsent is the §6.3.1.1 side effect whose status is contested (Q-20).
              sourceOfTruth:
                type: string
                enum: [gatewayProjection, finologeeRecord]
                description: Which copy the change came from. It exists because D-01 is open.
    AuthorisationStatusChanged:
      name: AuthorisationStatusChanged
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            required: [authorisationId, scaStatus]
            properties:
              authorisationId: { type: string }
              purpose: { type: string, enum: [consent, payment] }
              scaStatus: { type: string }
              scaMethod: { type: string, enum: [otp, qrCode, biometric] }
              surface:
                type: string
                enum: [ciamLoginScreen, enrolledDevice]
                description: Which of the bank's two surfaces the step happened on — the input to RM-OPS-SCA-FUNNEL.
    PaymentStatusChanged:
      name: PaymentStatusChanged
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            required: [paymentId, transactionStatus]
            properties:
              paymentId: { type: string }
              transactionStatus: { type: string }
    AccountDataRead:
      name: AccountDataRead
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            required: [consentId, endpoint, psuInvolved]
            properties:
              consentId: { type: string }
              endpoint: { type: string }
              resourceId: { type: string }
              psuInvolved:
                type: boolean
                description: Whether the read consumed the daily allowance (R-FRQ-02).
              outcome: { type: string, enum: [served, refusedConsent, refusedFrequency] }
