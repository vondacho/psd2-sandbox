openapi: 3.1.0
info:
  title: Bank XS2A interface — MVP profile (proposal)
  version: 0.1.0-proposal
  summary: The subset of the Berlin Group NextGenPSD2 XS2A interface v1.3.16 proposed for WS-01 and MVP-01.
  description: |
    PROPOSAL generated by AI (interface id `API-XS2A-PROFILE`).

    * Written from the text of the NextGenPSD2 XS2A Implementation Guidelines v1.3.16 (SRC-IG).
      It is **not** a copy or a modification of the Berlin Group's published OpenAPI files.
      Whether this profile may be published in this repository under the IG's CC BY-ND 4.0
      licence is open (Q-07). Before implementation, diff it against the official Berlin Group
      file (validation report W-API-02).
    * Scope: AIS on dedicated accounts; single `sepa-credit-transfers` payments in JSON; the
      redirect SCA approach. Everything else is unscheduled on the story map.
    * `x-delivery` names the delivery pack that first needs an operation. `x-trace` links each
      operation to its stories and its example-map rules.
    * Error bodies use the NextGenPSD2 `tppMessages` variant (§4.13.3.1), per assumption A-07.
      The alternative is RFC 7807 (Q-25).
    * Authentication is mutual TLS with an eIDAS QWAC (§3). A bearer token is conditional on the
      OAuth pre-step or the OAuth2 SCA approach (§4.3) and is marked so.
  license:
    name: Unresolved — see Q-07
    identifier: NOASSERTION
servers:
  - url: https://api.bank.invalid/psd2
    description: Placeholder host. The TPP-facing host is served by Finologee or by the ASPSP gateway (D-05).
tags:
  - name: consents
    description: AIS consent resources (CTX-CONSENT).
  - name: authorisations
    description: Authorisation sub-resources of consents and payments (CTX-TXN-AUTHORISATION).
  - name: accounts
    description: Consented account data (CTX-ACCOUNT-INFORMATION).
  - name: payments
    description: Single payment initiations (CTX-PAYMENT-INITIATION).
security:
  - tppQwac: []
  - tppQwac: []
    bankOrTppBearer: []

paths:
  /v1/consents:
    post:
      tags: [consents]
      operationId: createConsent
      summary: Create an AIS consent on dedicated accounts (§6.3.1.1)
      description: |
        The consent record is mastered at Finologee (SRC-ADR); the gateway holds the enforcing
        projection (A-16). Which side allocates the consentId is D-01.
      x-delivery: WS-01
      x-trace:
        stories: [STORY-TPP-IDENTIFY, STORY-CONSENT-DEDICATED, STORY-SCA-DEVICE]
        rules: [R-CNS-01, R-CNS-03, R-CNS-04, R-CNS-05, R-CNS-07, R-SCA-01]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PsuIpAddress'
        - $ref: '#/components/parameters/PsuID'
        - $ref: '#/components/parameters/TppRedirectPreferred'
        - $ref: '#/components/parameters/TppRedirectUri'
        - $ref: '#/components/parameters/TppNokRedirectUri'
        - $ref: '#/components/parameters/TppExplicitAuthorisationPreferred'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
            example:
              access:
                balances: [{ iban: DE40100100103307118608 }]
                transactions: [{ iban: DE40100100103307118608 }]
              recurringIndicator: true
              validUntil: '2026-11-01'
              frequencyPerDay: 4
              combinedServiceIndicator: false
      responses:
        '201':
          description: Consent resource created; consentStatus is received.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ASPSP-SCA-Approach: { $ref: '#/components/headers/AspspScaApproach' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentsResponse201' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '405': { $ref: '#/components/responses/Error405' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/consents/{consentId}:
    parameters:
      - $ref: '#/components/parameters/ConsentIdPath'
    get:
      tags: [consents]
      operationId: getConsentInformation
      summary: Read the consent object (§6.3.3)
      x-delivery: MVP-01
      x-read-model: RM-TPP-CONSENT-STATUS
      x-trace:
        stories: [STORY-TPP-RESOURCE-ISOLATION, STORY-CONSENT-READ]
        rules: [R-CNS-05, R-TPP-03, R-TPP-04]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The consent as the bank stored it, including an adjusted validUntil.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentInformationResponse200' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
    delete:
      tags: [consents]
      operationId: deleteConsent
      summary: Terminate the consent (§6.4)
      x-delivery: WS-01
      x-trace:
        stories: [STORY-CONSENT-DELETE]
        rules: [R-REV-01, R-REV-02]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '204':
          description: Deleted; consentStatus becomes terminatedByTpp.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/consents/{consentId}/status:
    parameters:
      - $ref: '#/components/parameters/ConsentIdPath'
    get:
      tags: [consents]
      operationId: getConsentStatus
      summary: Read the consent status (§6.3.2)
      x-delivery: WS-01
      x-read-model: RM-TPP-CONSENT-STATUS
      x-trace:
        stories: [STORY-CONSENT-STATUS, STORY-CONSENT-EXPIRY]
        rules: [R-SCA-03, R-REV-03]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The current consentStatus.
          headers: { X-Request-ID: { $ref: '#/components/headers/XRequestID' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatusResponse200' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/consents/{consentId}/authorisations:
    parameters:
      - $ref: '#/components/parameters/ConsentIdPath'
    get:
      tags: [authorisations]
      operationId: getConsentAuthorisations
      summary: List the authorisation sub-resources of a consent (§7.4)
      x-delivery: MVP-01
      x-read-model: RM-TPP-SCA-STATUS
      x-trace:
        stories: [STORY-SCA-STATUS]
        rules: [R-SCA-03]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The authorisation ids of this consent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Authorisations' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [authorisations]
      operationId: startConsentAuthorisation
      summary: Start an authorisation explicitly (§7.1)
      description: |
        The bank starts authorisations implicitly (§4.6, R-SCA-01), so this operation exists for
        TPPs that set TPP-Explicit-Authorisation-Preferred. It is MVP scope, not skeleton scope.
      x-delivery: MVP-01
      x-trace:
        stories: [STORY-SCA-DEVICE, STORY-SCA-STATUS]
        rules: [R-SCA-01]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/TppRedirectUri'
      responses:
        '201':
          description: Authorisation sub-resource created; scaStatus is received.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartScaResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /v1/consents/{consentId}/authorisations/{authorisationId}:
    parameters:
      - $ref: '#/components/parameters/ConsentIdPath'
      - $ref: '#/components/parameters/AuthorisationIdPath'
    get:
      tags: [authorisations]
      operationId: getConsentScaStatus
      summary: Read the SCA status of a consent authorisation (§7.5)
      x-delivery: MVP-01
      x-read-model: RM-TPP-SCA-STATUS
      x-trace:
        stories: [STORY-SCA-STATUS, STORY-SCA-DEVICE]
        rules: [R-SCA-03, R-SCA-04]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The current scaStatus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScaStatusResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/accounts:
    get:
      tags: [accounts]
      operationId: getAccountList
      summary: Read the list of accessible accounts (§6.5.1)
      x-delivery: WS-01
      x-read-model: RM-TPP-ACCOUNTS
      x-trace:
        stories: [STORY-READ-ACCOUNT-LIST, STORY-CONSENT-EXPIRY, STORY-CONSENT-DELETE]
        rules: [R-ACC-01, R-ACC-02, R-ACC-03, R-ACC-04, R-REV-02, R-REV-03]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/ConsentIdHeader'
        - $ref: '#/components/parameters/PsuInvolved'
        - name: withBalance
          in: query
          required: false
          schema: { type: boolean }
          description: Include the booking balance where the consent allows it (§6.5.1).
      responses:
        '200':
          description: The accounts this consent makes accessible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/accounts/{account-id}:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      tags: [accounts]
      operationId: readAccountDetails
      summary: Read the details of one account (§6.5.2)
      x-delivery: MVP-01
      x-read-model: RM-TPP-ACCOUNTS
      x-trace:
        stories: [STORY-READ-ACCOUNT-DETAILS, STORY-ENFORCE-FREQUENCY]
        rules: [R-ACC-01, R-ACC-03, R-FRQ-01]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/ConsentIdHeader'
        - $ref: '#/components/parameters/PsuInvolved'
      responses:
        '200':
          description: One account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDetailsResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/accounts/{account-id}/balances:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      tags: [accounts]
      operationId: getBalances
      summary: Read the balances of one account (§6.5.3)
      x-delivery: MVP-01
      x-trace:
        stories: [STORY-READ-BALANCES, STORY-ENFORCE-FREQUENCY]
        rules: [R-ACC-03, R-FRQ-01, R-FRQ-02, R-FRQ-03]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/ConsentIdHeader'
        - $ref: '#/components/parameters/PsuInvolved'
      responses:
        '200':
          description: The balances the consent allows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadBalanceResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/accounts/{account-id}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      tags: [accounts]
      operationId: getTransactionList
      summary: Read a transaction report for one account (§6.5.4)
      x-delivery: MVP-01
      x-trace:
        stories: [STORY-READ-TRANSACTIONS, STORY-ENFORCE-FREQUENCY]
        rules: [R-ACC-03, R-FRQ-01, R-FRQ-02]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/ConsentIdHeader'
        - $ref: '#/components/parameters/PsuInvolved'
        - name: bookingStatus
          in: query
          required: true
          schema: { type: string, enum: [booked, pending, both] }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: The transaction report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionsResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /v1/payments/sepa-credit-transfers:
    post:
      tags: [payments]
      operationId: initiatePayment
      summary: Initiate a single SEPA credit transfer (§5.3.1)
      x-delivery: WS-01
      x-trace:
        stories: [STORY-TPP-IDENTIFY, STORY-TPP-ROLE-CHECK, STORY-PIS-INITIATE-SCT]
        rules: [R-TPP-01, R-TPP-02, R-PIS-01, R-PIS-02, R-PIS-03]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PsuIpAddress'
        - $ref: '#/components/parameters/TppRedirectPreferred'
        - $ref: '#/components/parameters/TppRedirectUri'
        - $ref: '#/components/parameters/TppNokRedirectUri'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInitiationRequest' }
            example:
              instructedAmount: { currency: EUR, amount: '123.50' }
              debtorAccount: { iban: DE40100100103307118608 }
              creditorAccount: { iban: DE02100100109307118603 }
              creditorName: Merchant Inc
              remittanceInformationUnstructured: Ref Number Merchant
      responses:
        '201':
          description: Payment initiation created; transactionStatus is RCVD.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-ID: { $ref: '#/components/headers/XRequestID' }
            ASPSP-SCA-Approach: { $ref: '#/components/headers/AspspScaApproach' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInitiationResponse201' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '405': { $ref: '#/components/responses/Error405' }

  /v1/payments/sepa-credit-transfers/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
    get:
      tags: [payments]
      operationId: getPaymentInformation
      summary: Read the payment initiation back (§5.6)
      x-delivery: MVP-01
      x-read-model: RM-TPP-PAYMENT-STATUS
      x-trace:
        stories: [STORY-PIS-READ-PAYMENT, STORY-TPP-RESOURCE-ISOLATION]
        rules: [R-PIS-04, R-PST-02, R-TPP-03]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The payment as submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInitiationRequest' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/payments/sepa-credit-transfers/{paymentId}/status:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
    get:
      tags: [payments]
      operationId: getPaymentInitiationStatus
      summary: Read the transaction status of the payment (§5.4)
      x-delivery: WS-01
      x-read-model: RM-TPP-PAYMENT-STATUS
      x-trace:
        stories: [STORY-PIS-STATUS, STORY-PIS-SCA-TIMEOUT]
        rules: [R-PST-01, R-PST-02, R-PST-03, R-PST-04]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The current transactionStatus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatusResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

  /v1/payments/sepa-credit-transfers/{paymentId}/authorisations:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
    get:
      tags: [authorisations]
      operationId: getPaymentInitiationAuthorisation
      summary: List the authorisation sub-resources of a payment (§7.4)
      x-delivery: MVP-01
      x-read-model: RM-TPP-SCA-STATUS
      x-trace:
        stories: [STORY-SCA-STATUS, STORY-PIS-SCA-DEVICE]
        rules: [R-SCA-03]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The authorisation ids of this payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Authorisations' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
    post:
      tags: [authorisations]
      operationId: startPaymentAuthorisation
      summary: Start a payment authorisation explicitly (§7.1)
      x-delivery: MVP-01
      x-trace:
        stories: [STORY-PIS-SCA-DEVICE]
        rules: [R-SCA-01]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/TppRedirectUri'
      responses:
        '201':
          description: Authorisation sub-resource created.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartScaResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }

  /v1/payments/sepa-credit-transfers/{paymentId}/authorisations/{authorisationId}:
    parameters:
      - $ref: '#/components/parameters/PaymentIdPath'
      - $ref: '#/components/parameters/AuthorisationIdPath'
    get:
      tags: [authorisations]
      operationId: getPaymentInitiationScaStatus
      summary: Read the SCA status of a payment authorisation (§7.5)
      x-delivery: MVP-01
      x-read-model: RM-TPP-SCA-STATUS
      x-trace:
        stories: [STORY-PIS-SCA-DEVICE, STORY-SCA-STATUS]
        rules: [R-SCA-03, R-PST-03]
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: The current scaStatus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScaStatusResponse' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }

components:
  securitySchemes:
    tppQwac:
      type: mutualTLS
      description: eIDAS qualified website authentication certificate carrying the TPP roles (§3, §4.9).
    bankOrTppBearer:
      type: http
      scheme: bearer
      description: Conditional; only where OAuth 2.0 is used as a pre-step or as the SCA approach (§4.3, §13). D-03.

  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Unique to the call, set by the initiating party (§4.1). Carried on every span and event.
    PsuIpAddress:
      name: PSU-IP-Address
      in: header
      required: true
      schema: { type: string }
      description: The PSU's IP address as seen by the TPP (§6.3.1.1, §4.8).
    PsuID:
      name: PSU-ID
      in: header
      required: false
      schema: { type: string }
      description: Conditional in the standard. Whether the bank mandates it is Q-26.
    PsuInvolved:
      name: PSU-IP-Address
      in: header
      required: false
      schema: { type: string }
      description: |
        Present when the PSU is actively triggering the read; absent for an unattended read
        (§6.3.1.1, §4.8). The presence of this header is what R-FRQ-02 keys on.
    TppRedirectPreferred:
      name: TPP-Redirect-Preferred
      in: header
      required: false
      schema: { type: boolean }
    TppRedirectUri:
      name: TPP-Redirect-URI
      in: header
      required: false
      schema: { type: string, format: uri }
      description: Mandated for the redirect approach (§4.10). The bank offers redirect (D-03).
    TppNokRedirectUri:
      name: TPP-Nok-Redirect-URI
      in: header
      required: false
      schema: { type: string, format: uri }
    TppExplicitAuthorisationPreferred:
      name: TPP-Explicit-Authorisation-Preferred
      in: header
      required: false
      schema: { type: boolean }
    ConsentIdHeader:
      name: Consent-ID
      in: header
      required: true
      schema: { type: string }
      description: The consent this read is decided against (§6.5).
    ConsentIdPath:
      name: consentId
      in: path
      required: true
      schema: { type: string }
    AuthorisationIdPath:
      name: authorisationId
      in: path
      required: true
      schema: { type: string }
    PaymentIdPath:
      name: paymentId
      in: path
      required: true
      schema: { type: string }
    AccountIdPath:
      name: account-id
      in: path
      required: true
      schema: { type: string }
      description: The resourceId from the account list, never an IBAN (INV-ACC-01, §14.20).

  headers:
    Location:
      schema: { type: string, format: uri }
      description: Location of the created resource.
    XRequestID:
      schema: { type: string, format: uuid }
    AspspScaApproach:
      schema: { type: string, enum: [REDIRECT, DECOUPLED, EMBEDDED] }
      description: The bank returns REDIRECT (D-03). OAuth is subsumed under REDIRECT (§6.3.1.1, C-05).

  schemas:
    AccountReference:
      type: object
      properties:
        iban: { type: string, pattern: '^[A-Z]{2}[0-9]{2}[a-zA-Z0-9]{1,30}$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
      required: [iban]
      description: IBAN only in the MVP (A-13).
    AccountAccess:
      type: object
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/AccountReference' } }
        balances: { type: array, items: { $ref: '#/components/schemas/AccountReference' } }
        transactions: { type: array, items: { $ref: '#/components/schemas/AccountReference' } }
      description: |
        Dedicated accounts only in the MVP. Every list that is used carries at least one
        reference (INV-CNS-02, R-CNS-01). The availableAccounts, availableAccountsWithBalance and
        allPsd2 variants are unscheduled (Q-10).
    ConsentRequest:
      type: object
      required: [access, recurringIndicator, validUntil, frequencyPerDay, combinedServiceIndicator]
      properties:
        access: { $ref: '#/components/schemas/AccountAccess' }
        recurringIndicator: { type: boolean }
        validUntil: { type: string, format: date }
        frequencyPerDay: { type: integer, minimum: 1 }
        combinedServiceIndicator: { type: boolean }
    ConsentStatus:
      type: string
      enum: [received, rejected, partiallyAuthorised, valid, revokedByPsu, expired, terminatedByTpp]
      description: §14.15. The full set is modelled; revokedByPsu has no path in as the context is written (C-07, D-09).
    ScaStatus:
      type: string
      enum: [received, psuIdentified, psuAuthenticated, scaMethodSelected, started, unconfirmed, finalised, failed, exempted]
      description: §14.16.
    TransactionStatus:
      type: string
      enum: [RCVD, ACTC, ACCP, ACFC, ACSP, ACSC, ACWC, ACWP, PDNG, PATC, PART, RJCT, CANC]
      description: §14.13. ACCT and REJT from the flow diagrams are not valid codes (C-03).
    HrefType:
      type: object
      properties:
        href: { type: string }
    Links:
      type: object
      description: Steering hyperlinks (§4.15, §14.6).
      properties:
        scaRedirect: { $ref: '#/components/schemas/HrefType' }
        scaStatus: { $ref: '#/components/schemas/HrefType' }
        status: { $ref: '#/components/schemas/HrefType' }
        self: { $ref: '#/components/schemas/HrefType' }
        startAuthorisation: { $ref: '#/components/schemas/HrefType' }
    ConsentsResponse201:
      type: object
      x-read-model: RM-TPP-CONSENT-STATUS
      properties:
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
        consentId: { type: string }
        _links: { $ref: '#/components/schemas/Links' }
        psuMessage: { type: string, maxLength: 500 }
    ConsentInformationResponse200:
      type: object
      x-read-model: RM-TPP-CONSENT-STATUS
      properties:
        access: { $ref: '#/components/schemas/AccountAccess' }
        recurringIndicator: { type: boolean }
        validUntil:
          type: string
          format: date
          description: As granted by the bank, which may be earlier than requested (R-CNS-05, INV-CNS-05).
        frequencyPerDay: { type: integer }
        lastActionDate: { type: string, format: date }
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
    ConsentStatusResponse200:
      type: object
      x-read-model: RM-TPP-CONSENT-STATUS
      properties:
        consentStatus: { $ref: '#/components/schemas/ConsentStatus' }
    Authorisations:
      type: object
      x-read-model: RM-TPP-SCA-STATUS
      properties:
        authorisationIds: { type: array, items: { type: string } }
    StartScaResponse:
      type: object
      properties:
        scaStatus: { $ref: '#/components/schemas/ScaStatus' }
        authorisationId: { type: string }
        _links: { $ref: '#/components/schemas/Links' }
    ScaStatusResponse:
      type: object
      x-read-model: RM-TPP-SCA-STATUS
      properties:
        scaStatus: { $ref: '#/components/schemas/ScaStatus' }
    AccountDetails:
      type: object
      properties:
        resourceId: { type: string, description: Opaque; never an IBAN (INV-ACC-01). }
        iban: { type: string }
        currency: { type: string }
        name: { type: string }
        cashAccountType: { type: string }
        _links: { $ref: '#/components/schemas/Links' }
    AccountList:
      type: object
      x-read-model: RM-TPP-ACCOUNTS
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/AccountDetails' } }
    AccountDetailsResponse:
      type: object
      x-read-model: RM-TPP-ACCOUNTS
      properties:
        account: { $ref: '#/components/schemas/AccountDetails' }
    Amount:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount: { type: string, pattern: '^-?[0-9]{1,14}(\.[0-9]{1,3})?$' }
    Balance:
      type: object
      properties:
        balanceAmount: { $ref: '#/components/schemas/Amount' }
        balanceType: { type: string }
        referenceDate: { type: string, format: date }
    ReadBalanceResponse:
      type: object
      properties:
        account: { $ref: '#/components/schemas/AccountReference' }
        balances: { type: array, items: { $ref: '#/components/schemas/Balance' } }
    Transaction:
      type: object
      properties:
        transactionId: { type: string }
        bookingDate: { type: string, format: date }
        valueDate: { type: string, format: date }
        transactionAmount: { $ref: '#/components/schemas/Amount' }
        creditorName: { type: string }
        remittanceInformationUnstructured: { type: string }
    TransactionsResponse:
      type: object
      properties:
        account: { $ref: '#/components/schemas/AccountReference' }
        transactions:
          type: object
          properties:
            booked: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
            pending: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
    PaymentInitiationRequest:
      type: object
      required: [instructedAmount, debtorAccount, creditorAccount, creditorName]
      properties:
        instructedAmount: { $ref: '#/components/schemas/Amount' }
        debtorAccount: { $ref: '#/components/schemas/AccountReference' }
        creditorAccount: { $ref: '#/components/schemas/AccountReference' }
        creditorName: { type: string, maxLength: 70 }
        remittanceInformationUnstructured: { type: string, maxLength: 140 }
        requestedExecutionDate: { type: string, format: date }
    PaymentInitiationResponse201:
      type: object
      properties:
        transactionStatus: { $ref: '#/components/schemas/TransactionStatus' }
        paymentId: { type: string }
        _links: { $ref: '#/components/schemas/Links' }
        psuMessage: { type: string, maxLength: 500 }
    PaymentStatusResponse:
      type: object
      x-read-model: RM-TPP-PAYMENT-STATUS
      properties:
        transactionStatus: { $ref: '#/components/schemas/TransactionStatus' }
    TppMessage:
      type: object
      required: [category, code]
      properties:
        category: { type: string, enum: [ERROR, WARNING] }
        code: { type: string }
        path: { type: string }
        text: { type: string, maxLength: 500 }
    Error:
      type: object
      description: The tppMessages variant of §4.13.3.1 (A-07; the alternative is RFC 7807, Q-25).
      properties:
        tppMessages: { type: array, items: { $ref: '#/components/schemas/TppMessage' } }
        _links: { $ref: '#/components/schemas/Links' }

  responses:
    Error400:
      description: FORMAT_ERROR, PARAMETER_NOT_CONSISTENT, SESSIONS_NOT_SUPPORTED, SERVICE_INVALID (§14.11).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error401:
      description: CERTIFICATE_*, SIGNATURE_*, ROLE_INVALID, CONSENT_INVALID, CONSENT_EXPIRED, PSU_CREDENTIALS_INVALID (§14.11).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error403:
      description: CONSENT_UNKNOWN, RESOURCE_UNKNOWN, SERVICE_BLOCKED (§14.11). 403 against 404 is Q-19.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error404:
      description: RESOURCE_UNKNOWN where an account-id is in the path (§14.11.1).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error405:
      description: SERVICE_INVALID for an HTTP method the resource does not support (§14.11.1).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error429:
      description: ACCESS_EXCEEDED — more unattended reads than frequencyPerDay (§14.11.3, R-FRQ-01).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
