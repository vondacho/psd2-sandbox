openapi: 3.1.0
info:
  title: PSU channel API — CIAM pages and device panels (proposal)
  version: 0.1.0-proposal
  summary: What the bank's own PSU surfaces read and write while a TPP request is being authorised.
  description: |
    PROPOSAL generated by AI (interface id `API-PSU-CHANNEL`). Internal: it is never exposed to a
    TPP.

    Two clients, and only two, because `SRC-ADR` names only two bank surfaces:

    * the **CIAM browser pages** — the login screen and the waiting, outcome and unavailable
      pages proposed around it (`Q-18`);
    * the **bank mobile app** on the enrolled device — the OTP, QR-code and biometric screens and
      the consent confirmation panel.

    The consent screen is the TPP's and is not a client of this API.

    Every operation names the screens it serves (`x-screens`), the read model it produces
    (`x-read-model`), the stories that justify it (`x-trace`) and its delivery pack
    (`x-delivery`).

    **`getPaymentApproval` has no screen.** It produces `RM-PAYMENT-APPROVAL`, which nothing in
    the supplied context displays. It is kept, marked `x-conditional-on: Q-17`, so that the gap
    is visible in the contract instead of being quietly designed away.
  license:
    name: Internal proposal
    identifier: NOASSERTION
servers:
  - url: https://psu-channel.bank.invalid
    description: Placeholder host, reachable from the CIAM and from the bank app only.
tags:
  - name: redirect
    description: Resolving and closing a redirect session (CTX-TXN-AUTHORISATION).
  - name: device
    description: What the enrolled device shows and what the PSU decides there.

paths:
  /sessions/{redirectToken}:
    parameters:
      - name: redirectToken
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [redirect]
      operationId: resolveRedirectSession
      summary: Resolve a scaRedirect link into an authorisation, once
      description: Single use and time-boxed (INV-AUT-03). A second call answers `alreadyUsed`.
      x-delivery: WS-01
      x-screens: [SCR-CIAM-LOGIN, SCR-CIAM-UNAVAILABLE]
      x-read-model: RM-REDIRECT-SESSION
      x-trace:
        stories: [STORY-SCA-DEVICE, STORY-PIS-SCA-DEVICE, STORY-SCA-REQUEST-UNAVAILABLE]
        rules: [R-SCA-01, R-SCA-05]
      responses:
        '200':
          description: A live session; the CIAM may authenticate the PSU.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectSession' }
        '409':
          description: Unknown, expired or already used; the unavailable page is shown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedirectSession' }

  /authorisations/{authorisationId}/outcome:
    parameters:
      - $ref: '#/components/parameters/AuthorisationIdPath'
    get:
      tags: [redirect]
      operationId: getAuthorisationOutcome
      summary: What the browser should show while and after the device is asked
      x-delivery: WS-01
      x-screens: [SCR-CIAM-AWAIT-DEVICE, SCR-CIAM-OUTCOME, SCR-CIAM-UNAVAILABLE]
      x-read-model: RM-AUTHORISATION-OUTCOME
      x-trace:
        stories: [STORY-SCA-DEVICE, STORY-PIS-SCA-DEVICE, STORY-SCA-OUTCOME, STORY-SCA-REQUEST-UNAVAILABLE]
        rules: [R-SCA-03, R-SCA-04]
      responses:
        '200':
          description: The outcome as the PSU should read it, with the way back to the TPP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }

  /authorisations/{authorisationId}/prompt:
    parameters:
      - $ref: '#/components/parameters/AuthorisationIdPath'
    get:
      tags: [device]
      operationId: getScaPrompt
      summary: What the enrolled device shows when it asks the PSU to confirm identity
      x-delivery: WS-01
      x-screens: [SCR-APP-OTP, SCR-APP-QR, SCR-APP-BIOMETRIC]
      x-read-model: RM-SCA-PROMPT
      x-trace:
        stories: [STORY-SCA-DEVICE, STORY-PIS-SCA-DEVICE, STORY-SCA-METHOD-CHOICE]
        rules: [R-SCA-02]
      responses:
        '200':
          description: The prompt, including the digest of the subject being authorised.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScaPrompt' }

  /authorisations/{authorisationId}/sca-result:
    parameters:
      - $ref: '#/components/parameters/AuthorisationIdPath'
    post:
      tags: [device]
      operationId: recordScaResult
      summary: Record the SCA result the CIAM obtained on the enrolled device
      description: |
        Refused unless the result carries the digest of the subject the PSU was shown
        (INV-AUT-05). Who signs the assertion the gateway trusts is Q-16.
      x-delivery: WS-01
      x-trace:
        stories: [STORY-SCA-DEVICE, STORY-PIS-SCA-DEVICE]
        rules: [R-SCA-02, R-SCA-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScaResult' }
      responses:
        '200':
          description: Accepted; the authorisation moves on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }
        '409':
          description: Refused because the subject changed after it was shown (INV-AUT-05).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }

  /authorisations/{authorisationId}/consent-approval:
    parameters:
      - $ref: '#/components/parameters/AuthorisationIdPath'
    get:
      tags: [device]
      operationId: getConsentApproval
      summary: The items of the consent, as the confirmation panel must show them
      description: |
        This is the ASPSP "displaying the consent details to the PSU when performing the SCA" of
        the Detailed Consent model (SRC-IG §6, A-15). `validUntil` is the date the bank granted
        (INV-CNS-05), not the date the TPP asked for.
      x-delivery: WS-01
      x-screens: [SCR-APP-CONSENT-CONFIRM]
      x-read-model: RM-CONSENT-APPROVAL
      x-trace:
        stories: [STORY-SCA-DEVICE, STORY-SCA-CONSENT-DETAILS]
        rules: [R-SCA-02, R-CNS-05]
      responses:
        '200':
          description: What the panel shows, with the digest that the SCA result must carry back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentApproval' }
    post:
      tags: [device]
      operationId: decideConsentApproval
      summary: Record that the PSU confirmed or declined the items of the consent
      x-delivery: WS-01
      x-screens: [SCR-APP-CONSENT-CONFIRM]
      x-read-model: RM-CONSENT-APPROVAL
      x-trace:
        stories: [STORY-SCA-DEVICE, STORY-SCA-CONSENT-DETAILS, STORY-SCA-OUTCOME]
        rules: [R-SCA-02, R-SCA-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentDecision' }
      responses:
        '200':
          description: Recorded; the consent becomes valid or rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }
        '409':
          description: Refused because the consent changed after the panel was shown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorisationOutcome' }

  /authorisations/{authorisationId}/payment-approval:
    parameters:
      - $ref: '#/components/parameters/AuthorisationIdPath'
    get:
      tags: [device]
      operationId: getPaymentApproval
      summary: The amount and payee of a payment — for a surface that does not exist yet
      description: |
        **No screen calls this operation.** `SRC-ADR` names a consent confirmation panel and
        nothing for a payment, so the bank has no surface on which a PSU sees what is being paid
        (C-09). Dynamic linking requires one (SRC-IG §5.1).

        The operation is specified because the data and the digest are known; what is missing is
        the decision about where to show them. It is not implemented until `Q-17` is answered.
      x-delivery: MVP-01
      x-conditional-on: Q-17
      x-read-model: RM-PAYMENT-APPROVAL
      x-trace:
        stories: [STORY-PIS-SCA-DEVICE]
        rules: [R-PIS-05]
      responses:
        '200':
          description: What a payment confirmation surface would show.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentApproval' }
        '501':
          description: Not implemented while Q-17 is open.

components:
  parameters:
    AuthorisationIdPath:
      name: authorisationId
      in: path
      required: true
      schema: { type: string }

  schemas:
    RedirectSession:
      type: object
      properties:
        authorisationId: { type: string }
        purpose: { type: string, enum: [consent, payment] }
        state: { type: string, enum: [live, expired, alreadyUsed, unknown] }
        deadline: { type: string, format: date-time }
        returnUri: { type: string, format: uri }
        nokReturnUri: { type: string, format: uri }
    AuthorisationOutcome:
      type: object
      properties:
        purpose: { type: string, enum: [consent, payment] }
        outcome:
          type: string
          enum: [pendingSca, approved, declined, failed, expired, alreadyHandled]
        tppLegalName: { type: string }
        returnUri: { type: string, format: uri }
        psuMessage: { type: string }
    ScaPrompt:
      type: object
      properties:
        tppLegalName: { type: string }
        purpose: { type: string, enum: [consent, payment] }
        subjectSummary:
          type: string
          description: |
            One line describing what is being confirmed. For a consent it names the TPP and the
            access. For a payment it would name the amount and the payee — see Q-17.
        approvedSubjectDigest: { type: string }
        method: { type: string, enum: [otp, qrCode, biometric] }
        requestedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
    ScaResult:
      type: object
      required: [outcome, approvedSubjectDigest]
      properties:
        outcome: { type: string, enum: [confirmed, rejected, expired] }
        approvedSubjectDigest: { type: string }
        method: { type: string, enum: [otp, qrCode, biometric] }
        deviceId: { type: string }
        assertion: { type: string, description: 'The signed statement that SCA happened; its issuer is Q-16.' }
    ConsentApprovalAccount:
      type: object
      properties:
        label: { type: string, description: 'How the account is named to the PSU — Q-32.' }
        currency: { type: string }
        accessTypes: { type: array, items: { type: string, enum: [accounts, balances, transactions] } }
        heldByPsu: { type: boolean, description: 'False is possible; what the panel then does is Q-35.' }
    ConsentApproval:
      type: object
      properties:
        tppLegalName: { type: string }
        tppBrand: { type: string, description: 'Shown or not — Q-33.' }
        accounts: { type: array, items: { $ref: '#/components/schemas/ConsentApprovalAccount' } }
        recurring: { type: boolean }
        validUntil: { type: string, format: date }
        frequencyPerDay: { type: integer }
        deadline: { type: string, format: date-time }
        approvedSubjectDigest: { type: string }
    ConsentDecision:
      type: object
      required: [decision, approvedSubjectDigest]
      properties:
        decision: { type: string, enum: [confirmed, declined] }
        approvedSubjectDigest: { type: string }
    PaymentApproval:
      type: object
      properties:
        tppLegalName: { type: string }
        instructedAmount: { type: string }
        currency: { type: string }
        creditorName: { type: string }
        creditorAccountLabel: { type: string }
        debtorAccountLabel: { type: string }
        remittanceInformation: { type: string }
        requestedExecutionDate: { type: string, format: date }
        charges: { type: string, description: 'Shown or not — Q-46.' }
        approvedSubjectDigest: { type: string }
