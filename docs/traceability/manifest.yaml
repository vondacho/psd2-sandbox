input_revisions:
  # The decisions were made in 7ed3eb1. 44ea858 rephrased all four context documents and grew the
  # terminology; no decision, option or open question changed, so artefact citations of "SRC-ADR
  # 7ed3eb1" still name the revision that decided.
  SRC-ADR: { decided: 7ed3eb1, wording: 44ea858 }
  SRC-Q: { decided: 7ed3eb1, wording: 44ea858 }     # token compatibility — answered in d-02-token-compatibility.md
  SRC-EVAL: { decided: 7ed3eb1, wording: 44ea858 }  # consent management make or buy — answered in d-01-consent-management.md
