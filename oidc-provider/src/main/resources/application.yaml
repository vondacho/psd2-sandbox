spring:
  application:
    name: oidc-provider

server:
  port: 7443

sandbox:
  pki:
    # Written by bank-xs2a at startup; only ca.pem is read, as a trust anchor.
    directory: /tmp/psd2-pki
  oidc:
    browser-port: 7080
    browser-base-url: http://localhost:7080
    issuer: https://oidc-provider.sandbox
    audience: https://api.bank.sandbox/psd2
  bank:
    # The Bank's internal connector, for the anticorruption-layer lookup.
    internal-base-url: http://localhost:8081
  ciam:
    base-url: http://localhost:9443

logging:
  level:
    ch.obya.psd2: INFO
